# Test datasource isolation is configured via %test profile in main application.properties.

# Test-only consumer of wallet-events on its own group, reading from the beginning of the topic,
# so integration tests can observe exactly what the producer published to Kafka.
mp.messaging.incoming.wallet-events-test-in.connector=smallrye-kafka
mp.messaging.incoming.wallet-events-test-in.topic=wallet-events
mp.messaging.incoming.wallet-events-test-in.group.id=wallet-events-test-collector
mp.messaging.incoming.wallet-events-test-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.wallet-events-test-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.wallet-events-test-in.auto.offset.reset=earliest
