# --- HTTP ---
quarkus.http.port=8888
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# --- Datasource (PostgreSQL) ---
quarkus.datasource.db-kind=postgresql
# dev/prod use the local Docker DB; test profile has no URL so dev-services (Testcontainers) auto-start.
%dev.quarkus.datasource.username=walletledger
%dev.quarkus.datasource.password=walletledger
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5435/walletledger
%prod.quarkus.datasource.username=walletledger
%prod.quarkus.datasource.password=walletledger
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5435/walletledger

# --- Hibernate ORM ---
# Schema is owned by Flyway. Hibernate validates only.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.log.sql=false

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# --- JWT (SmallRye) ---
# Keys live at classpath root (src/main/resources), NOT under META-INF/resources
# which is the static web root — a private key there would be served over HTTP.
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=wallet-ledger
smallrye.jwt.sign.key.location=privateKey.pem

# --- Kafka / SmallRye Reactive Messaging (Phase F1) ---
# Producer: wallet events out, keyed by walletId (set per-message via Record).
mp.messaging.outgoing.wallet-events-out.connector=smallrye-kafka
mp.messaging.outgoing.wallet-events-out.topic=wallet-events
mp.messaging.outgoing.wallet-events-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.wallet-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Consumer: SSE fan-out. Unique group.id per instance (broadcast) so every node sees every event;
# a shared group would split partitions and starve SSE clients on other nodes. latest = live only.
mp.messaging.incoming.wallet-events-in.connector=smallrye-kafka
mp.messaging.incoming.wallet-events-in.topic=wallet-events
mp.messaging.incoming.wallet-events-in.group.id=wallet-sse-${quarkus.uuid}
mp.messaging.incoming.wallet-events-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.wallet-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.wallet-events-in.auto.offset.reset=latest
# dev/test: no kafka.bootstrap.servers set → Quarkus Dev Services starts a Kafka container.
# Pin it to the same Apache Kafka image as docker-compose so all environments match.
quarkus.kafka.devservices.image-name=apache/kafka:4.0.0
# prod: point at the docker-compose broker.
%prod.kafka.bootstrap.servers=localhost:9092

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# --- Test profile: use Quarkus dev-services (Testcontainers), NOT the dev DB ---
# No jdbc.url for test profile → dev-services auto-start a Testcontainers PostgreSQL.
%test.quarkus.datasource.devservices.image-name=postgres:15-alpine
%test.quarkus.http.test-port=0
